# CI Workflow
# Purpose: Basic CI checks including Python setup, dependency installation, tests, and benchmark aggregation
# Environment: SYNTRA_TEST_MODE=1 for testing without live API calls

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNTRA_TEST_MODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-mock flake8

      - name: Run tests
        run: make test-all

      - name: Run benchmark aggregation
        run: make bench-aggregate
        continue-on-error: true

      - name: Display summary
        if: always()
        run: |
          if [ -f runs/summary/benchmarks_overview.md ]; then
            echo "=== Benchmark Overview ==="
            head -n 60 runs/summary/benchmarks_overview.md
          else
            echo "No benchmark summary generated"
          fi

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            runs/summary/*.md
            runs/summary/*.csv
            runs/**/*.log
          if-no-files-found: ignore
