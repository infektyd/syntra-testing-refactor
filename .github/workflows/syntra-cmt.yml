# SyntraCMT CI Workflow
# Purpose: Comprehensive CI for SyntraCMT including validation, testing
# Environment: SYNTRA_TEST_MODE=1 for testing

name: SyntraCMT CI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNTRA_TEST_MODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-mock flake8

      - name: Validate benchmarks
        run: make validate-bench

      - name: Test CMT
        run: make test-cmt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syntra-cmt-artifacts
          path: |
            runs/*.json
            runs/figs/*.png
            runs/summary/*.md
            runs/summary/*.csv
          if-no-files-found: ignore
