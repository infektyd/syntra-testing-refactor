# HF-CMT Grader Workflow
# Purpose: Test the HuggingFace CMT (Commonsense Math Transparency) grader tools
# Environment: SYNTRA_TEST_MODE=1 for testing

name: HF-CMT Grader

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNTRA_TEST_MODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-mock

      - name: Run CMT tests
        run: make test-cmt

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmt-grader-test-artifacts
          path: |
            **/*.log
            runs/**/*.json
          if-no-files-found: ignore
